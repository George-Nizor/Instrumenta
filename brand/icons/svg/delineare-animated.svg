<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="ii-play" role="img" aria-label="Delineare"><style>/* Motion for the Instrumenta icon family (brand v2). Icons rest until an ancestor has `ii-play`, or an `ii-hover` ancestor is hovered or focused; they return to rest when that stops. The shapes are drawn by instrumenta-icons.js; this file only moves them. */ .ii-body, [class*="m-"] { transform-box: fill-box; } .ii-body { transform-origin: 50% 100%; } .m-pipe, .m-lid, .m-hop { transform-origin: 50% 100%; } .m-clap { transform-origin: 0% 100%; } .m-flip { transform-origin: 0% 50%; } .m-twinkle, .m-bar, .m-span { transform-origin: 50% 50%; } .m-type { stroke-dasharray: 20; stroke-dashoffset: 0; } .m-draw { stroke-dasharray: 15; stroke-dashoffset: 0; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .ii-body { animation: ii-bob 1.6s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-pipe { animation: ii-pipe 1.6s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-clap { animation: ii-clap 1.6s cubic-bezier(.4, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-twinkle { animation: ii-twinkle 2.2s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-type { animation: ii-type 2.4s steps(8) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-flip { animation: ii-flip 2.4s cubic-bezier(.6, 0, .3, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-hop { animation: ii-hop 1.3s cubic-bezier(.3, 0, .3, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-bar { animation: ii-bar .9s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-span { animation: ii-span 2s cubic-bezier(.5, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-tip-l { animation: ii-tip-l 2s cubic-bezier(.5, 0, .2, 1) infinite; } :is(.ii-play, 