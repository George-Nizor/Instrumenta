<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drafting sheet: Session on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,100..900,0..100,0..1&amp;family=Commissioner:FLAR,VOLM,slnt,wght@0..100,0..100,-12..0,100..900&amp;family=Spline+Sans+Mono:wght@300..700&amp;display=swap">
<style>
body{margin:0}
.light{--chrome:#FBF9F4;--ink:#1B1A17;--muted:#5E584F;--rule:#D6CFC1;--pressed:#D9F4FB;--link:#005A72}
.dark{--chrome:#181817;--ink:#ECE8E1;--muted:#A8A096;--rule:#34312C;--pressed:#0B3440;--link:#88E0F6}
.mono{font-family:"Spline Sans Mono",ui-monospace,monospace}
.tool{font:inherit;font-size:11px;background:transparent;color:var(--ink);border:1.5px solid var(--rule);border-radius:8px;min-width:58px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tool[aria-pressed="true"]{background:var(--pressed);border-color:var(--link)}
.tool:focus-visible,.big:focus-visible,.icon:focus-visible{outline:2px solid var(--link);outline-offset:2px}
.icon{width:44px;height:44px;border:0;background:transparent;color:var(--ink);display:grid;place-items:center;border-radius:8px;cursor:pointer}
.big{font:inherit;font-weight:650;font-size:18px;border-radius:10px;min-height:56px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--chrome); color: var(--ink); font-family: Commissioner, system-ui, sans-serif; font-variation-settings: &quot;FLAR&quot; 40; overflow: hidden;">
  <header style="display: flex; align-items: center; gap: 6px; padding: 10px 12px 6px 6px;">
    <button class="icon" type="button" aria-label="End session"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px;">
      <span class="mono" style="font-size: 11px; letter-spacing: .1em; color: var(--muted);">C. EXERCISE, 1 OF 5</span>
      <span style="font-weight: 650; font-size: 16px;">Five forms, one light</span>
    </div>
    <span class="mono" role="timer" aria-label="18 minutes 42 seconds left" style="font-size: 30px; font-weight: 500; letter-spacing: -.02em;">18:42</span>
  </header>

  <div style="padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 4px;" aria-hidden="true">
    <div style="display: flex; height: 10px; border: 1.5px solid var(--ink);">
      <div style="flex: 11.3 1 0; background: #00B5DA; border-right: 1.5px solid var(--ink);"></div>
      <div style="flex: 18.7 1 0;"></div>
    </div>
    <div class="mono" style="display: flex; justify-content: space-between; font-size: 10px; color: var(--muted);"><span>0</span><span>5</span><span>10</span><span>15</span><span>20</span><span>25</span><span>30</span></div>
  </div>

  <div style="position: relative; flex: 1; min-height: 0; background: #3B3B3B; display: grid; place-items: center; overflow: hidden;">
    <div style="position: relative; width: 100%; aspect-ratio: 3 / 4;">
      <img src="/_blob/0b508d53e21cde5b37e7651d4df55c82" width="900" height="1200" alt="Reference: an egg in front of a box on a table, lit from the upper left" style="display: block; width: 100%; height: 100%;">
      <div aria-hidden="true" style="position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); pointer-events: none;">
        <div style="border-right: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4);"></div><div style="border-right: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4);"></div><div style="border-bottom: 1px solid rgba(255,255,255,.4);"></div>
        <div style="border-right: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4);"></div><div style="border-right: 1px solid rgba(255,255,255,.4); border-bottom: 1px solid rgba(255,255,255,.4);"></div><div style="border-bottom: 1px solid rgba(255,255,255,.4);"></div>
        <div style="border-right: 1px solid rgba(255,255,255,.4);"></div><div style="border-right: 1px solid rgba(255,255,255,.4);"></div><div></div>
      </div>
    <span class="mono" style="position: absolute; left: 8px; bottom: 8px; font-size: 10px; color: #E6E6E6; background: rgba(20,20,20,.72); padding: 3px 7px; border-radius: 4px;">Rendered in the light tool. CC0</span>
    </div>
  </div>

  <div role="toolbar" aria-label="Reference tools" style="display: flex; justify-content: space-between; gap: 6px; padding: 12px 16px 10px;">
    <button class="tool" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18" stroke-dasharray="2 2.5"/><path d="M9 7L4 12l5 5z"/><path d="M15 7l5 5-5 5z"/></svg>Flip</button>
    <button class="tool" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg>Grey</button>
    <button class="tool" type="button" aria-pressed="true"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>Grid</button>
    <button class="tool" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 12h18M5 8.5c2-1.4 4.5-2.2 7-2.2s5 .8 7 2.2M5 15.5c2 1.4 4.5 2.2 7 2.2s5-.8 7-2.2"/></svg>Squint</button>
    <button class="tool" type="button" aria-pressed="false"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M8 12h0M12 5l7 7-7 7"/></svg>Next</button>
  </div>

  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 10px; padding: 0 16px 22px;">
    <button class="big" type="button" style="background: transparent; color: var(--ink); border: 1.5px solid var(--ink);">Done early</button>
    <button class="big" type="button" style="background: #00B5DA; color: #001A20; border: 2px solid #001A20; box-shadow: 3px 3px 0 #005A72;"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>Pause</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
