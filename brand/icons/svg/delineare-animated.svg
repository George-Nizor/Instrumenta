measuring arrows draw in towards their middle, then extend back out to the edge they measure. The heads travel what the shaft loses: a quarter of half the 13.2-unit arrow. */ @keyframes ii-span { 0%, 70%, 100% { transform: scaleX(1); } 20% { transform: scaleX(.75); } } @keyframes ii-tip-l { 0%, 70%, 100% { transform: translateX(0); } 20% { transform: translateX(1.65px); } } @keyframes ii-tip-r { 0%, 70%, 100% { transform: translateX(0); } 20% { transform: translateX(-1.65px); } } @media (prefers-reduced-motion: reduce) { .ii-body, [class*="m-"] { animation: none !important; } } </style><g transform="translate(-1.50 -1.65)"><g class="ii-body"><g><g transform="translate(3.00 3.30)"><g class="m-sweep"><g transform="translate(15 38) rotate(-45)"><path d="M0 0L9 -5L9 5Z" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><path d="M0 0L9 -5L9 5Z" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><path d="M0 0L3.4 -1.9L3.4 1.9Z" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="9" y="-5" width="20" height="10" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="9" y="-5" width="20" height="3.1" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="9" y="-5" width="20" height="10" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><path d="M9 1.7H29" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="29" y="-5" width="4.6" height="10" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="29" y="-5" width="4.6" height="10" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><path d="M31.3 -5V5" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="33.6" y="-4.5" width="5.2" height="9" rx="3" fill="#4F5200" stroke="#4F5200" stroke-width="3.2" stroke-linejoin="round"/><rect x="33.6" y="-