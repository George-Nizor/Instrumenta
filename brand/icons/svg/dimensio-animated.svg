<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" class="ii-play" role="img" aria-label="Dimensio"><style>/* Motion for the Instrumenta icon family (brand v2). Icons rest until an ancestor has `ii-play`, or an `ii-hover` ancestor is hovered or focused; they return to rest when that stops. The shapes are drawn by instrumenta-icons.js; this file only moves them. */ .ii-body, [class*="m-"] { transform-box: fill-box; } .ii-body { transform-origin: 50% 100%; } .m-pipe, .m-lid, .m-hop { transform-origin: 50% 100%; } .m-clap { transform-origin: 0% 100%; } .m-flip { transform-origin: 0% 50%; } .m-twinkle, .m-bar, .m-span { transform-origin: 50% 50%; } .m-type { stroke-dasharray: 20; stroke-dashoffset: 0; } .m-draw { stroke-dasharray: 15; stroke-dashoffset: 0; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .ii-body { animation: ii-bob 1.6s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-pipe { animation: ii-pipe 1.6s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-clap { animation: ii-clap 1.6s cubic-bezier(.4, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-twinkle { animation: ii-twinkle 2.2s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-type { animation: ii-type 2.4s steps(8) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-flip { animation: ii-flip 2.4s cubic-bezier(.6, 0, .3, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-hop { animation: ii-hop 1.3s cubic-bezier(.3, 0, .3, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-bar { animation: ii-bar .9s ease-in-out infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-span { animation: ii-span 2s cubic-bezier(.5, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-tip-l { animation: ii-tip-l 2s cubic-bezier(.5, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-tip-r { animation: ii-tip-r 2s cubic-bezier(.5, 0, .2, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-draw { animation: ii-draw 2s cubic-bezier(.5, 0, .3, 1) infinite; } :is(.ii-play, .ii-hover:hover, .ii-hover:focus-visible) .m-sweep { animation: ii-sweep 2s cubic-bezier(.5, 0, .3, 1) infinite; } .w1 { animation-delay: .1s !important; } .w2 { animation-delay: .2s !important; } .w3 { animation-delay: .3s !important; } .w4 { animation-delay: .4s !important; } .w5 { animation-delay: .5s !important; } .w6 { animation-delay: .6s !important; } .w7 { animation-delay: .7s !important; } .w8 { animation-delay: .8s !important; } .w9 { animation-delay: .9s !important; } @keyframes ii-bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-1px, -1px); } } @keyframes ii-pipe { 0%, 60%, 100% { transform: scaleY(1); } 25% { transform: scaleY(1.13); } } @keyframes ii-clap { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-16deg); } 42% { transform: rotate(0); } 50% { transform: rotate(-3deg); } 56% { transform: rotate(0); } } @keyframes ii-twinkle { 0%, 100% { transform: scale(1) rotate(0); } 40% { transform: scale(1.3) rotate(45deg); } 70% { transform: scale(.88) rotate(90deg); } } @keyframes ii-type { 0% { stroke-dashoffset: 20; } 45%, 100% { stroke-dashoffset: 0; } } @keyframes ii-flip { 0%, 55%, 100% { transform: scaleX(1); } 75% { transform: scaleX(-.2); } } @keyframes ii-hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 12% { transform: translateY(0) scale(1.06, .92); } 45% { transform: translateY(-5px) scale(.96, 1.05); } 80% { transform: translateY(0) scale(1.04, .95); } } @keyframes ii-bar { 0%, 100% { transform: scaleY(.45); } 50% { transform: scaleY(1.15); } } @keyframes ii-draw { 0% { stroke-dashoffset: 15; } 60%, 100% { stroke-dashoffset: 0; } } @keyframes ii-sweep { 0% { transform: translate(-11.6px, 6.1px); } 60%, 100% { transform: translate(0, 0); } } /* The measuring arrows draw in towards their middle, then extend back out to the edge they measure. The heads travel what the shaft loses: a quarter of half the 13.2-unit arrow. */ @keyframes ii-span { 0%, 70%, 100% { transform: scaleX(1); } 20% { transform: scaleX(.75); } } @keyframes ii-tip-l { 0%, 70%, 100% { transform: translateX(0); } 20% { transform: translateX(1.65px); } } @keyframes ii-tip-r { 0%, 70%, 100% { transform: translateX(0); } 20% { transform: translateX(-1.65px); } } @media (prefers-reduced-motion: reduce) { .ii-body, [class*="m-"] { animation: none !important; } } </style><g transform="translate(-1.50 -1.65)"><g class="ii-body"><g><g transform="translate(3.00 3.30)"><path d="M25.6 9.4L37.03 16L25.6 22.6L14.17 16Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><path d="M14.17 16L25.6 22.6L25.6 35.8L14.17 29.2Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><path d="M25.6 22.6L37.03 16L37.03 29.2L25.6 35.8Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><path d="M14.17 16L25.6 9.4L37.03 16L37.03 29.2L25.6 35.8L14.17 29.2ZM14.17 16L25.6 22.6L37.03 16M25.6 22.6L25.6 35.8" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><g transform="translate(7.76 18.9) rotate(90)"></g><g transform="translate(13.48 36.2) rotate(30)"></g><g transform="translate(37.72 36.2) rotate(-30)"></g><g transform="translate(7.76 18.9) rotate(90)"></g><g transform="translate(13.48 36.2) rotate(30)"></g><g transform="translate(37.72 36.2) rotate(-30)"></g></g><g transform="translate(2.50 2.75)"><path d="M25.6 9.4L37.03 16L25.6 22.6L14.17 16Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><path d="M14.17 16L25.6 22.6L25.6 35.8L14.17 29.2Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><path d="M25.6 22.6L37.03 16L37.03 29.2L25.6 35.8Z" fill="#7D331B" stroke="#7D331B" stroke-width="3.2" stroke-linejoin="round"/><pa